name: Deploy storybook to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Check scripts and reader invariants
        run: |
          node --check content.js
          node --check scenes.js
          node --check reader-model.js
          node --check story.js
          node --test tests/reader.test.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static website
        run: |
          mkdir -p _site
          cp index.html read.html preview.html style.css content.js scenes.js reader-model.js story.js favicon.svg .nojekyll _site/
          cp -R assets _site/assets
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
