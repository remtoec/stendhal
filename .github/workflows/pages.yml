name: Deploy storybook to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Check the text file and the reader
        run: |
          node --check book-format.js
          node --check scenes.js
          node --check reader-model.js
          node --check reader.js
          node --test tests/book.test.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build the site and the full-text edition
        run: node scripts/build.js
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
