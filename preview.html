<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>故事書 · 響應式預覽</title><style>*{box-sizing:border-box}body{margin:0;background:#dad5cb;color:#34392f;font:14px system-ui,sans-serif}header{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;padding:14px}button,select{font:inherit;padding:9px 12px;color:inherit;background:#faf5e8;border:1px solid #a99f8b;border-radius:4px}button[aria-pressed=true]{background:#52654c;color:white}main{display:flex;justify-content:center;overflow:auto;padding:10px 16px 30px}iframe{height:800px;max-height:calc(100vh - 110px);flex-shrink:0;border:1px solid #a99f8b;box-shadow:0 15px 50px #51473030;border-radius:8px;background:#f1eadc}a{color:inherit}label{display:flex;gap:8px;align-items:center}p{text-align:center;font-size:12px;color:#626451}</style></head><body><header><a href="index.html">回到網站</a><button data-width="320" aria-pressed="false">320 px</button><button data-width="390" aria-pressed="true">390 px</button><button data-width="768" aria-pressed="false">768 px</button><button data-width="1280" aria-pressed="false">1280 px</button></header><main><iframe id="preview" title="故事書預覽" src="index.html" width="390"></iframe></main><script>const frame=document.getElementById('preview');document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{frame.width=button.dataset.width;document.querySelectorAll('[data-width]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));}));</script></body></html>
